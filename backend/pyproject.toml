[project]
name = "dispatch-solar-mapping"
version = "0.1.0"
description = "Local solar-site mapping and production estimates"
readme = "../README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "django-cors-headers>=4.7,<5",
    "djangorestframework>=3.16,<3.17",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs[compatible-mypy]>=3.16,<3.17",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "pytest-socket>=0.7,<0.8",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-ra --strict-markers --disable-socket"
pythonpath = ["."]
testpaths = ["sites"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
python_version = "3.12"
strict = true
mypy_path = "."

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
